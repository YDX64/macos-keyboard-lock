name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build.sh
      - name: Self-test (helper protocol and installer, no root needed)
        run: ./tools/selftest.sh
